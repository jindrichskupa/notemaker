name: Build

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
    branches: [master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: TypeScript check
        run: pnpm check

      - name: Run tests
        run: pnpm test:run

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: aarch64-apple-darwin
            name: macOS-arm64
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            name: Linux-x64
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            name: Windows-x64

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Install frontend dependencies
        run: pnpm install

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: --target ${{ matrix.target }}

      - name: Sign macOS app and recreate DMG
        if: matrix.platform == 'macos-latest'
        run: |
          set -e
          BUNDLE_DIR="src-tauri/target/${{ matrix.target }}/release/bundle/macos"

          # Find the DMG
          DMG_PATH=$(find "$BUNDLE_DIR" -name "*.dmg" -type f | head -1)
          if [ -z "$DMG_PATH" ]; then
            echo "No DMG found!"
            exit 1
          fi
          echo "Found DMG: $DMG_PATH"

          # Create temp directory
          WORK_DIR=$(mktemp -d)
          MOUNT_POINT="$WORK_DIR/dmg_mount"
          mkdir -p "$MOUNT_POINT"

          # Mount the DMG
          echo "Mounting DMG..."
          hdiutil attach "$DMG_PATH" -mountpoint "$MOUNT_POINT" -nobrowse -quiet

          # Find and copy the .app
          APP_NAME=$(ls "$MOUNT_POINT" | grep "\.app$" | head -1)
          if [ -z "$APP_NAME" ]; then
            echo "No .app found in DMG!"
            hdiutil detach "$MOUNT_POINT" -quiet
            exit 1
          fi
          echo "Found app: $APP_NAME"

          # Copy app to work directory
          cp -R "$MOUNT_POINT/$APP_NAME" "$WORK_DIR/"

          # Unmount original DMG
          hdiutil detach "$MOUNT_POINT" -quiet

          # Sign the app with ad-hoc signature
          echo "Signing app..."
          codesign --force --deep --sign - "$WORK_DIR/$APP_NAME"

          # Verify signature
          echo "Verifying signature..."
          codesign --verify --verbose "$WORK_DIR/$APP_NAME"

          # Remove old DMG
          rm "$DMG_PATH"

          # Create new DMG with signed app
          echo "Creating new DMG..."
          hdiutil create -volname "Notemaker" -srcfolder "$WORK_DIR/$APP_NAME" -ov -format UDZO "$DMG_PATH"

          # Cleanup
          rm -rf "$WORK_DIR"

          echo "Done! Signed DMG created at: $DMG_PATH"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: notemaker-${{ matrix.name }}
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.dmg
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.app
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.deb
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.AppImage
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.exe
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.msi
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Display structure of downloaded files
        run: ls -R artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          draft: true
          generate_release_notes: true
          body: |
            ## Installation

            ### macOS
            Download the `.dmg` file for your architecture:
            - `Notemaker_*_aarch64.dmg` - Apple Silicon (M1/M2/M3)
            - `Notemaker_*_x64.dmg` - Intel

            **Note:** The app is not notarized. After opening the DMG:
            1. Drag Notemaker to Applications
            2. Right-click the app and select "Open"
            3. Click "Open" in the dialog

            Or run in Terminal:
            ```bash
            xattr -cr /Applications/Notemaker.app
            ```

            ### Linux
            - `.AppImage` - Universal (make executable with `chmod +x`)
            - `.deb` - Debian/Ubuntu

            ### Windows
            - `.msi` - Windows Installer
            - `.exe` - NSIS Installer

          files: |
            artifacts/**/*.dmg
            artifacts/**/*.deb
            artifacts/**/*.AppImage
            artifacts/**/*.exe
            artifacts/**/*.msi
